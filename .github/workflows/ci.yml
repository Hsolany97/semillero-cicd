name: CI - Java + Cypress

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Pruebas Java
        run: gradle test

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Cypress
        run: npm install

      - name: Iniciar aplicación
        run: |
          gradle bootRun > app.log 2>&1 &
          echo $! > app.pid

      - name: Esperar aplicación
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Aplicación disponible"
              exit 0
            fi
            sleep 2
          done
          echo "La aplicación no inició a tiempo"
          cat app.log
          exit 1

      - name: E2E con Cypress
        run: npm run cy:run

      - name: Mostrar log si falla
        if: failure()
        run: cat app.log || true
